name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner (runtime has zero third-party deps)
        run: python -m pip install --upgrade pip pytest==8.3.5

      - name: Unit + integration (in-process)
        run: python -m pytest -m "not slow" -q

      # 冒烟只验证进程编排 + SQLite 状态机；
      # 真实 SIGKILL 重派（tests/test_kill_redispatch.py）与 2h soak 不在 CI 中运行。
      - name: CLI smoke (multi-process orchestration, no SIGKILL/soak)
        run: |
          python -m evalconsole demo --db ci-smoke.db --tasks 20 --workers 2 \
            --timeout 90 --html ci-dashboard.html --alerts-file ci-alerts.jsonl
          python -m evalconsole status --db ci-smoke.db
